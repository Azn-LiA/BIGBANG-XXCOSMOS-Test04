<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>XX:COSMOS — VIP Freebies Draw</title>

<!--
=====================================================================
  XX:COSMOS — TIRAGE AU SORT DES FREEBIES VIP
  Prototype v0.2 — fichier unique, autonome, prêt pour GitHub Pages.

  ⚠️ TOUT CE QUI EST MARQUÉ "### ASSET ###" EST UN PLACEHOLDER.
  Le cahier des charges graphique complet (formats, dimensions, poids)
  est donné dans le message de réponse.

  Nouveautés v0.2 :
  - bouton de tirage personnalisable (couleur et/ou image)
  - sélecteur de langue FR / EN (interface uniquement, pas les
    contenus libres comme les noms de freebies, le titre ou l'accroche)
  - personnages dans les feux visibles en grisé/opacité réduite
    même avant le lancement du tirage
=====================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    /* ---- Palette (neon / cosmos) ---- */
    --cosmos-black:#06060f;
    --cosmos-deep:#0b0b1e;
    --cosmos-panel:#11112a;
    --star-white:#f4f4ff;
    --star-dim:#9a9ac2;
    --neon-blue:#2fe5ff;
    --neon-yellow:#ffe14d;
    --neon-pink:#ff3d9a;
    --ultra-gold:#ffcf5c;
    --danger:#ff4d6d;

    /* Couleur néon derrière le freebie gagnant — mise à jour en JS selon la couleur du tirage */
    --reveal-glow-rgb: 255,61,154;

    /* ---- Type ---- */
    --font-display:'Orbitron', sans-serif;
    --font-body:'Space Grotesk', sans-serif;

    /* ---- Assets (### À REMPLACER PAR LE GRAPHISTE / DEV ### ) ---- */
    /* Logo XX:COSMOS — SVG ou PNG transparent, ~800x240px, <100Ko */
    --asset-logo: '';
    /* Fond galaxie — JPG, ~1500x3000px portrait, <500Ko */
    --asset-background: '';
    /* Cadre du feu tricolore (optionnel) — PNG transparent, ~600x1400px, <300Ko */
    --asset-light-frame: '';
    /* Personnage dans le feu BLEU — PNG transparent, ~500x500px, <150Ko */
    --asset-char-blue: '';
    /* Personnage dans le feu JAUNE — PNG transparent, ~500x500px, <150Ko */
    --asset-char-yellow: '';
    /* Personnage dans le feu ROSE — PNG transparent, ~500x500px, <150Ko */
    --asset-char-pink: '';
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%; background:var(--cosmos-black); overscroll-behavior:none;}
  body{
    font-family:var(--font-body);
    color:var(--star-white);
    display:flex; justify-content:center;
  }

  /* ---------- App shell — cadré iPhone 14 Pro Max (430 x 932) ---------- */
  #app{
    position:relative;
    width:100%;
    max-width:430px;
    height:100dvh;
    min-height:100dvh;
    overflow:hidden;
    background:
      radial-gradient(ellipse at 50% 15%, rgba(255,61,154,.18), transparent 55%),
      radial-gradient(ellipse at 20% 80%, rgba(47,229,255,.14), transparent 55%),
      var(--asset-background) center/cover no-repeat,
      var(--cosmos-black);
  }

  /* Starfield fallback / overlay, works with or without --asset-background */
  #stars{
    position:absolute; inset:0; z-index:0; pointer-events:none;
  }
  #stars span{
    position:absolute; width:2px; height:2px; border-radius:50%;
    background:var(--star-white); opacity:.6;
    animation:twinkle 3.2s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.15;} 50%{opacity:.9;}}

  /* Nuage de points façon voie lactée, dessinant discrètement la forme du logo
     COSMOS derrière le feu tricolore et le carrousel des freebies.
     Le conteneur interne garde le ratio d'aspect du visuel source (926.7 x 726.9)
     quelle que soit la hauteur réelle de l'écran, pour ne jamais l'écraser. */
  #galaxy-shape{
    position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden;
  }
  #galaxy-shape-inner{
    position:absolute; left:0; top:50%; width:100%;
    aspect-ratio:926.7 / 726.9;
    transform:translateY(-50%);
  }
  .galaxy-dot{
    position:absolute; border-radius:50%;
    background:var(--star-white);
    animation-name:twinkle; animation-timing-function:ease-in-out; animation-iteration-count:infinite;
  }

  /* ---------- Header ---------- */
  header{
    position:relative; z-index:3;
    text-align:center;
    padding:28px 20px 6px;
  }
  #logo-img{
    height:72px; max-width:88%;
    object-fit:contain;
    filter:drop-shadow(0 0 10px rgba(47,229,255,.45));
  }
  #logo-fallback{
    font-family:var(--font-display);
    font-weight:900;
    font-size:26px;
    letter-spacing:2px;
    background:linear-gradient(90deg, var(--neon-blue), var(--neon-pink));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .tagline{
    margin-top:6px;
    font-size:13px;
    letter-spacing:1.5px;
    color:var(--star-dim);
  }

  /* ---------- Top-left language toggle ---------- */
  #lang-toggle{
    position:absolute; z-index:30; left:14px; top:14px;
    min-width:34px; height:28px; padding:0 10px; border-radius:14px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
    color:var(--star-dim); font-family:var(--font-body); font-weight:600; font-size:11px;
    letter-spacing:1px;
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------- Freebies carousel (behind the light) ---------- */
  #carousel-wrap{
    position:absolute; left:0; right:0; top:28%;
    height:340px;
    z-index:1;
    opacity:.6;
    overflow:hidden;
    mask-image:linear-gradient(90deg, transparent, black 15%, black 85%, transparent);
    -webkit-mask-image:linear-gradient(90deg, transparent, black 15%, black 85%, transparent);
  }
  #carousel-track{
    display:flex; align-items:center; gap:18px;
    height:100%;
    width:max-content;
    animation:scroll-linear 22s linear infinite;
  }
  #carousel-track.fast{ animation-duration:4s; }
  @keyframes scroll-linear{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }
  .fb-thumb{
    width:220px; height:220px; border-radius:22px;
    background:var(--cosmos-panel);
    display:flex; align-items:center; justify-content:center;
    background-size:cover; background-position:center;
    border:1px solid rgba(255,255,255,.06);
    flex:0 0 auto;
  }
  .fb-thumb span{ font-family:var(--font-display); font-size:12px; color:var(--star-dim); }

  /* ---------- Traffic light ---------- */
  #light-stage{
    position:relative; z-index:2;
    margin:24px auto 0;
    width:220px; height:400px;
  }
  #light-frame-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; z-index:2; pointer-events:none; }
  #light-housing{
    position:absolute; inset:0;
    background:linear-gradient(180deg, #0d0d20, #17172f);
    border-radius:38px;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 20px 50px rgba(0,0,0,.55), inset 0 0 40px rgba(0,0,0,.5);
    display:flex; flex-direction:column; align-items:center; justify-content:space-evenly;
    padding:20px 0;
    z-index:1;
  }
  .bulb{
    position:relative;
    width:104px; height:104px; border-radius:50%;
    background:#1a1a30;
    display:flex; align-items:center; justify-content:center;
    transition:box-shadow .15s ease, background-color .15s ease;
    overflow:hidden;
  }
  /* Personnages visibles au repos, en grisé / opacité réduite */
  .bulb img{
    width:78%; height:78%; object-fit:contain;
    opacity:.32;
    filter:grayscale(1) brightness(.85);
    transition:opacity .18s ease, filter .18s ease;
  }
  .bulb.on img{ opacity:1; filter:grayscale(0) brightness(1); }
  .bulb[data-color="blue"].on{ background:radial-gradient(circle at 40% 35%, #bdf9ff, var(--neon-blue) 60%, #0a4650); box-shadow:0 0 18px 6px var(--neon-blue), 0 0 46px 14px rgba(47,229,255,.55); }
  .bulb[data-color="yellow"].on{ background:radial-gradient(circle at 40% 35%, #fff9d6, var(--neon-yellow) 60%, #5b4a06); box-shadow:0 0 18px 6px var(--neon-yellow), 0 0 46px 14px rgba(255,225,77,.55); }
  .bulb[data-color="pink"].on{ background:radial-gradient(circle at 40% 35%, #ffd6ec, var(--neon-pink) 60%, #4a0a2a); box-shadow:0 0 18px 6px var(--neon-pink), 0 0 46px 14px rgba(255,61,154,.55); }
  .bulb.win{ transform:scale(1.06); }

  /* ---------- CTA draw button (below the light) ---------- */
  /* Par défaut : le visuel "couronne" fourni ; personnalisable en couleur/­image depuis l'admin */
  #draw-btn{
    position:relative; z-index:5;
    display:block;
    margin:-22px auto 0; /* la couronne remonte légèrement sous le feu */
    width:62%;
    max-width:230px;
    cursor:pointer;
    border:none; background:none; padding:0;
    transition:opacity .35s ease, transform .35s ease;
  }
  #draw-btn.hidden{ opacity:0; pointer-events:none; transform:scale(.85); height:0; margin:0 auto; overflow:hidden; }

  /* Mode image (SVG/PNG fourni) : le visuel porte déjà sa forme, on ne fait qu'ajouter le texte par-dessus */
  #draw-btn.has-image{
    aspect-ratio:583.5 / 303.9;
    animation:pulse-glow 2.6s ease-in-out infinite;
  }
  #draw-btn.has-image img{
    width:100%; height:100%; object-fit:contain; display:block;
  }
  @keyframes pulse-glow{
    0%,100%{ filter:drop-shadow(0 0 4px rgba(255,255,255,.15)); }
    50%{ filter:drop-shadow(0 0 16px rgba(255,255,255,.4)); }
  }

  /* Mode couleur (pas d'image renseignée) : pilule classique */
  #draw-btn.has-color{
    height:58px; border-radius:29px;
    border:2px solid rgba(255,255,255,.25);
    background-image:linear-gradient(90deg, rgba(255,255,255,.10), rgba(255,255,255,0) 60%);
    background-color:rgba(6,6,15,.55);
    background-size:cover; background-position:center;
    backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center;
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ box-shadow:0 0 0 0 rgba(255,255,255,.08);}
    50%{ box-shadow:0 0 0 10px rgba(255,255,255,0);}
  }

  #draw-btn-label{
    display:none; /* texte déjà intégré au visuel SVG fourni */
    position:absolute; left:0; right:0; z-index:2;
    color:var(--star-white);
    font-family:var(--font-display); font-weight:700; font-size:14px; letter-spacing:2px;
    text-shadow:0 2px 8px rgba(0,0,0,.85);
    text-align:center; pointer-events:none;
  }
  /* Dans le visuel fourni, la pilule de texte occupe la partie basse (sous la couronne) */
  #draw-btn.has-image #draw-btn-label{ top:72%; transform:translateY(-50%); }
  #draw-btn.has-color #draw-btn-label{ position:static; transform:none; }

  #draw-count{
    position:relative; z-index:3;
    text-align:center; margin-top:14px;
    font-size:11px; color:var(--star-dim); letter-spacing:1px;
  }

  #lightstick-img{
    position:relative; z-index:3;
    display:block;
    margin:16px auto 0;
    width:78%;
    max-width:320px;
    height:auto;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,.5));
  }

  /* ---------- Reveal screen ---------- */
  #reveal{
    position:absolute; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 30%, rgba(var(--reveal-glow-rgb),.25), transparent 60%), rgba(6,6,15,.92);
    opacity:0; pointer-events:none;
    transition:opacity .6s ease;
    padding:20px;
    text-align:center;
  }
  #reveal.show{ opacity:1; pointer-events:auto; }
  #reveal-ultra-tag{
    display:none;
    font-family:var(--font-display); font-size:12px; letter-spacing:3px;
    color:var(--cosmos-black); background:var(--ultra-gold);
    padding:6px 14px; border-radius:20px; margin-bottom:14px;
  }
  #reveal-ultra-tag.show{ display:inline-block; }
  #reveal-img{
    width:320px; height:320px; border-radius:28px;
    background:var(--cosmos-panel); background-size:cover; background-position:center;
    box-shadow:0 0 0 1px rgba(255,255,255,.08), 0 25px 60px rgba(0,0,0,.6), 0 0 70px rgba(var(--reveal-glow-rgb),.4);
    margin-bottom:22px;
    animation:reveal-pop .6s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes reveal-pop{ from{ transform:scale(.4) rotate(-6deg); opacity:0;} to{ transform:scale(1) rotate(0); opacity:1;} }
  #reveal-label{ font-size:12px; letter-spacing:2px; color:var(--star-dim); margin-bottom:6px;}
  #reveal-name{ font-family:var(--font-display); font-size:22px; font-weight:700; margin-bottom:26px; }
  .btn-primary{
    position:relative;
    margin:0 auto;
    width:56%;
    max-width:190px;
    aspect-ratio:583.5 / 303.9;
    border:none; background:none; padding:0;
    cursor:pointer;
    animation:pulse-glow 2.6s ease-in-out infinite;
  }
  .btn-primary img{ width:100%; height:100%; object-fit:contain; display:block; }
  #reveal-reset-label{
    display:none; /* texte déjà intégré au visuel SVG fourni, comme pour le bouton de tirage */
    position:absolute; left:0; right:0; top:72%; transform:translateY(-50%); z-index:2;
    color:var(--star-white);
    font-family:var(--font-display); font-weight:700; font-size:12px; letter-spacing:1.5px;
    text-shadow:0 2px 8px rgba(0,0,0,.85);
    text-align:center; pointer-events:none;
  }
  .confetti{ position:absolute; top:-10%; width:8px; height:14px; opacity:.9; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(120vh) rotate(400deg); opacity:0;} }

  /* ---------- Reveal flyer : le feu gagnant qui spin + grossit (plus grand que l'écran) pour "ouvrir" le reveal ---------- */
  .reveal-flyer{
    position:absolute; z-index:15;
    margin:0;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    border-radius:50%; /* reste rond du début à la fin */
    transition:transform 1.4s cubic-bezier(.25,.8,.35,1);
    will-change:transform;
    pointer-events:none;
  }
  .reveal-flyer img{ width:78%; height:78%; object-fit:contain; opacity:1 !important; filter:none !important; }

  /* ---------- Admin gear ---------- */
  #admin-fab{
    position:absolute; z-index:30; right:14px; bottom:14px;
    width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
    color:var(--star-dim); font-size:16px;
    display:flex; align-items:center; justify-content:center;
    opacity:.5;
  }

  /* ---------- Modals (admin) ---------- */
  .modal{
    position:absolute; inset:0; z-index:50;
    background:var(--cosmos-black);
    display:flex; flex-direction:column;
    transform:translateY(100%);
    transition:transform .35s ease;
  }
  .modal.show{ transform:translateY(0); }
  .modal-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 18px 12px; border-bottom:1px solid rgba(255,255,255,.08);
  }
  .modal-header h2{ font-family:var(--font-display); font-size:15px; letter-spacing:1px; margin:0; }
  .modal-close{ background:none; border:none; color:var(--star-white); font-size:22px; cursor:pointer; line-height:1;}
  .modal-body{ flex:1; overflow-y:auto; padding:14px 18px 40px; }

  .tabs{ display:flex; gap:6px; padding:10px 18px 0; }
  .tab-btn{
    flex:1; padding:9px 4px; border-radius:10px; border:1px solid rgba(255,255,255,.1);
    background:transparent; color:var(--star-dim); font-family:var(--font-body); font-size:12px; cursor:pointer;
  }
  .tab-btn.active{ background:var(--cosmos-panel); color:var(--star-white); border-color:rgba(255,255,255,.2); }
  .tab-pane{ display:none; }
  .tab-pane.active{ display:block; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:11px; color:var(--star-dim); margin-bottom:5px; letter-spacing:.5px; }
  .field input, .field select{
    width:100%; padding:10px 12px; border-radius:10px;
    background:var(--cosmos-panel); border:1px solid rgba(255,255,255,.1);
    color:var(--star-white); font-family:var(--font-body); font-size:14px;
  }
  .field input[type="color"]{ padding:4px; height:42px; cursor:pointer; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }

  .fb-row{
    display:flex; align-items:center; gap:10px;
    background:var(--cosmos-panel); border:1px solid rgba(255,255,255,.06);
    border-radius:14px; padding:10px; margin-bottom:10px;
  }
  .fb-row .fb-thumb{ width:46px; height:46px; border-radius:10px; flex:0 0 auto;}
  .fb-row .fb-mini-fields{ flex:1; display:flex; flex-direction:column; gap:6px; }
  .fb-row .fb-mini-fields input{ width:100%; padding:6px 8px; font-size:12px; border-radius:7px; background:#0d0d22; border:1px solid rgba(255,255,255,.1); color:var(--star-white); }
  .fb-row .qty-box{ display:flex; align-items:center; gap:4px; }
  .fb-row .qty-box button{ width:24px; height:24px; border-radius:6px; border:none; background:#1c1c38; color:var(--star-white); font-size:14px; }
  .ultra-badge{ font-size:9px; background:var(--ultra-gold); color:var(--cosmos-black); padding:2px 6px; border-radius:8px; margin-left:4px; }
  .stock-zero{ opacity:.4; }

  .stat-card{ background:var(--cosmos-panel); border-radius:14px; padding:14px; margin-bottom:12px; border:1px solid rgba(255,255,255,.06); }
  .stat-big{ font-family:var(--font-display); font-size:30px; }
  .stat-label{ font-size:11px; color:var(--star-dim); margin-top:2px; }
  .stat-line{ display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px dashed rgba(255,255,255,.08); }

  .btn-secondary{
    width:100%; padding:11px; border-radius:10px; border:1px solid rgba(255,255,255,.15);
    background:transparent; color:var(--star-white); font-size:12px; letter-spacing:.5px; cursor:pointer; margin-top:8px;
  }
  .btn-danger{ border-color:rgba(255,77,109,.4); color:var(--danger); }

  #pin-pad{ display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:18px; }
  #pin-dots{ display:flex; gap:10px; }
  #pin-dots span{ width:12px; height:12px; border-radius:50%; border:1px solid var(--star-dim); }
  #pin-dots span.filled{ background:var(--neon-pink); border-color:var(--neon-pink); }
  #pin-grid{ display:grid; grid-template-columns:repeat(3, 64px); gap:14px; }
  #pin-grid button{ width:64px; height:64px; border-radius:50%; background:var(--cosmos-panel); border:1px solid rgba(255,255,255,.1); color:var(--star-white); font-size:20px; }
  #pin-error{ color:var(--danger); font-size:12px; height:16px; }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<div id="app">
  <div id="stars"></div>
  <div id="galaxy-shape"><div id="galaxy-shape-inner"></div></div>

  <button id="lang-toggle">EN</button>

  <!-- ===== HEADER ===== -->
  <header>
    <img id="logo-img" class="hidden" alt="XX:COSMOS">
    <div id="logo-fallback">XX : COSMOS</div>
    <div class="tagline" id="tagline-text">let's found your VIP FREEBIES</div>
  </header>

  <!-- ===== FREEBIE CAROUSEL (behind the light) ===== -->
  <div id="carousel-wrap">
    <div id="carousel-track"></div>
  </div>

  <!-- ===== TRAFFIC LIGHT ===== -->
  <div id="light-stage">
    <img id="light-frame-img" class="hidden" alt="">
    <div id="light-housing">
      <div class="bulb" data-color="blue"><img id="char-blue-img" class="hidden" alt=""></div>
      <div class="bulb" data-color="yellow"><img id="char-yellow-img" class="hidden" alt=""></div>
      <div class="bulb" data-color="pink"><img id="char-pink-img" class="hidden" alt=""></div>
    </div>
  </div>

  <button id="draw-btn">
    <img id="draw-btn-img" class="hidden" alt="">
    <span id="draw-btn-label"></span>
  </button>

  <div id="draw-count">0 tirage effectué</div>

  <img id="lightstick-img" alt="">

  <!-- ===== REVEAL SCREEN ===== -->
  <div id="reveal">
    <div id="confetti-layer"></div>
    <div id="reveal-ultra-tag">LOT ULTRA ✦</div>
    <div id="reveal-img"></div>
    <div id="reveal-label">VOUS AVEZ GAGNÉ</div>
    <div id="reveal-name">—</div>
    <button class="btn-primary" id="reveal-reset-btn">
      <img id="reveal-reset-img" alt="">
      <span id="reveal-reset-label"></span>
    </button>
  </div>

  <!-- ===== ADMIN FAB ===== -->
  <button id="admin-fab" aria-label="Administration">⚙</button>

  <!-- ===== PIN MODAL ===== -->
  <div class="modal" id="pin-modal">
    <div class="modal-header">
      <h2 id="pin-modal-title">ADMINISTRATION</h2>
      <button class="modal-close" id="pin-close">×</button>
    </div>
    <div id="pin-pad">
      <div id="pin-dots"></div>
      <div id="pin-error"></div>
      <div id="pin-grid"></div>
    </div>
  </div>

  <!-- ===== ADMIN MODAL ===== -->
  <div class="modal" id="admin-modal">
    <div class="modal-header">
      <h2 id="admin-modal-title">GESTION XX:COSMOS</h2>
      <button class="modal-close" id="admin-close">×</button>
    </div>
    <div class="tabs">
      <button class="tab-btn active" data-tab="stock" id="lbl-tab-stock">Stock</button>
      <button class="tab-btn" data-tab="stats" id="lbl-tab-stats">Stats</button>

  const STORAGE_KEY = "xxcosmos_data_v1";

  function defaultFreebies(){
    const list = [];
    for(let i=1;i<=18;i++){
      list.push({
        id: "fb"+i,
        name: "Freebie "+i,
        image: "",
        stock: 20,
        isUltra: (i===18)
      });
    }
    list[17].stock = 3; // le lot ultra par défaut
    return list;
  }

  function defaultData(){
    return {
      config:{
        lang:"fr",
        title:"XX : COSMOS",
        tagline:"let's found your VIP FREEBIES",
        logo:"", bg:"", frame:"",
        charBlue:"", charYellow:"", charPink:"",
        lightstick:"",
        drawBtnUseImage:true, drawBtnColor:"#ff3d9a", drawBtnImage:"",
        pin:"2026"
      },
      freebies: defaultFreebies(),
      stats:{ total:0, byId:{} },
      history: []
    };
  }

  let data = loadData();

  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultData();
      const parsed = JSON.parse(raw);
      const merged = defaultData();
      merged.config = Object.assign(merged.config, parsed.config||{});
      merged.freebies = parsed.freebies || merged.freebies;
      merged.stats = parsed.stats || merged.stats;
      merged.history = parsed.history || merged.history;
      return merged;
    }catch(e){
      return defaultData();
    }
  }
  function saveData(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  /* ============================================================
     TIRAGE AU SORT
  ============================================================ */
  const drawBtn = document.getElementById("draw-btn");
  const bulbs = Array.from(document.querySelectorAll(".bulb"));
  const colors = ["blue","yellow","pink"];
  const revealEl = document.getElementById("reveal");
  const carouselTrack = document.getElementById("carousel-track");

  function weightedPickFreebie(){
    const pool = data.freebies.filter(f=>f.stock>0);
    if(pool.length===0) return null;
    const totalWeight = pool.reduce((s,f)=>s+f.stock,0);
    let r = Math.random()*totalWeight;
    for(const f of pool){
      r -= f.stock;
      if(r<=0) return f;
    }
    return pool[pool.length-1];
  }

  let drawing = false;

  drawBtn.addEventListener("click", ()=>{
    if(drawing) return;
    const winner = weightedPickFreebie();
    if(!winner){
      alert(t("stockEmptyAlert"));
      return;
    }
    drawing = true;
    drawBtn.classList.add("hidden");
    carouselTrack.classList.add("fast");
    runLightSequence(winner);
  });

  function runLightSequence(winner){
    let step = 0;
    const maxDelay = 420;
    const totalDurationMs = 6200;
    const start = performance.now();

    function tick(){
      bulbs.forEach(b=>b.classList.remove("on","win"));
      const active = bulbs[step % bulbs.length];
      active.classList.add("on");
      step++;

      const elapsed = performance.now() - start;
      const progress = Math.min(elapsed/totalDurationMs, 1);
      const delay = 80 + (maxDelay-80)*Math.pow(progress,2.2);

      if(elapsed < totalDurationMs){
        setTimeout(tick, delay);
      } else {
        finishSequence();
      }
    }
    tick();

    function finishSequence(){
      const finalColor = colors[Math.floor(Math.random()*colors.length)];
      bulbs.forEach(b=>b.classList.remove("on","win"));
      const finalBulb = bulbs.find(b=>b.dataset.color===finalColor);
      finalBulb.classList.add("on","win");
      setTimeout(()=> launchFlyer(finalBulb, ()=> showReveal(winner, finalColor)), 650);
    }
  }

  /* Fait "voler" une copie du feu gagnant depuis sa position jusqu'au centre de
     l'écran, en tournant sur lui-même et en grossissant, pour ouvrir le reveal. */
  function launchFlyer(sourceBulb, onDone){
    const app = document.getElementById("app");
    const appRect = app.getBoundingClientRect();
    const bulbRect = sourceBulb.getBoundingClientRect();

    const flyer = document.createElement("div");
    flyer.className = "bulb on win reveal-flyer";
    flyer.dataset.color = sourceBulb.dataset.color;

    const srcImg = sourceBulb.querySelector("img");
    if(srcImg && !srcImg.classList.contains("hidden") && srcImg.src){
      const clone = document.createElement("img");
      clone.src = srcImg.src;
      flyer.appendChild(clone);
    }

    flyer.style.left = (bulbRect.left - appRect.left) + "px";
    flyer.style.top = (bulbRect.top - appRect.top) + "px";
    flyer.style.width = bulbRect.width + "px";
    flyer.style.height = bulbRect.height + "px";
    flyer.style.transform = "translate(0,0) rotate(0deg) scale(1)";
    app.appendChild(flyer);

    sourceBulb.style.visibility = "hidden";

    void flyer.offsetWidth; // force reflow avant transition

    const targetSize = Math.hypot(appRect.width, appRect.height) * 1.15; // plus grand que l'écran, quel que soit l'appareil
    const bulbCenterX = bulbRect.left + bulbRect.width/2;
    const bulbCenterY = bulbRect.top + bulbRect.height/2;
    const targetCenterX = appRect.left + appRect.width/2;
    const targetCenterY = appRect.top + appRect.height/2;
    const dx = targetCenterX - bulbCenterX;
    const dy = targetCenterY - bulbCenterY;
    const scale = targetSize / bulbRect.width;

    requestAnimationFrame(()=>{
      flyer.style.transform = `translate(${dx}px, ${dy}px) rotate(720deg) scale(${scale})`;
    });

    setTimeout(()=>{
      flyer.style.transition += ", opacity .7s ease";
      flyer.style.opacity = "0";
      onDone();
      setTimeout(()=>{
        flyer.remove();
        sourceBulb.style.visibility = "";
      }, 700);
    }, 1400);
  }

  const COLOR_RGB = { blue:"47,229,255", yellow:"255,225,77", pink:"255,61,154" };

  function showReveal(winner, winColor){
    winner.stock = Math.max(0, winner.stock - 1);
    data.stats.total++;
    data.stats.byId[winner.id] = (data.stats.byId[winner.id]||0)+1;
    data.history.push({ id:winner.id, name:winner.name, ts:Date.now() });
    saveData();

    document.getElementById("app").style.setProperty("--reveal-glow-rgb", COLOR_RGB[winColor] || COLOR_RGB.pink);
    document.getElementById("reveal-img").style.backgroundImage = winner.image ? `url('${winner.image}')` : "none";
    document.getElementById("reveal-name").textContent = winner.name;
    document.getElementById("reveal-ultra-tag").classList.toggle("show", !!winner.isUltra);
    updateDrawCountText();

    spawnConfetti();
    revealEl.classList.add("show");
    renderCarousel();
    renderStockList();
    renderStats();
  }

  function spawnConfetti(){
    const layer = document.getElementById("confetti-layer");
    layer.innerHTML = "";
    const cols = ["var(--neon-blue)","var(--neon-yellow)","var(--neon-pink)","var(--ultra-gold)"];
    for(let i=0;i<40;i++){
      const p = document.createElement("div");
      p.className = "confetti";
      p.style.left = Math.random()*100+"%";
      p.style.background = cols[Math.floor(Math.random()*cols.length)];
      p.style.animationDuration = (2.2+Math.random()*1.6)+"s";
      p.style.animationDelay = (Math.random()*.4)+"s";
      layer.appendChild(p);
    }
  }

  document.getElementById("reveal-reset-btn").addEventListener("click", ()=>{
    revealEl.classList.remove("show");
    carouselTrack.classList.remove("fast");
    bulbs.forEach(b=>b.classList.remove("on","win"));
    drawBtn.classList.remove("hidden");
    drawing = false;
  });

  const pinModal = document.getElementById("pin-modal");
  const adminModal = document.getElementById("admin-modal");
  const pinDotsEl = document.getElementById("pin-dots");
  const pinGridEl = document.getElementById("pin-grid");
  const pinErrorEl = document.getElementById("pin-error");
  let pinBuffer = "";

  function buildPinPad(){
    pinDotsEl.innerHTML = "";
    for(let i=0;i<4;i++){
      const d = document.createElement("span");
      pinDotsEl.appendChild(d);
    }
    pinGridEl.innerHTML = "";
    ["1","2","3","4","5","6","7","8","9","⌫","0","OK"].forEach(k=>{
      const b = document.createElement("button");
      b.textContent = k;
      b.addEventListener("click", ()=>handlePinKey(k));
      pinGridEl.appendChild(b);
    });
  }
  buildPinPad();

  function refreshPinDots(){
    Array.from(pinDotsEl.children).forEach((d,i)=>{
      d.classList.toggle("filled", i < pinBuffer.length);
    });
  }
  function handlePinKey(k){
    pinErrorEl.textContent = "";
    if(k==="⌫"){ pinBuffer = pinBuffer.slice(0,-1); refreshPinDots(); return; }
    if(k==="OK"){
      if(pinBuffer === data.config.pin){
        openAdmin();
      } else {
        pinErrorEl.textContent = t("pinError");
        pinBuffer = "";
        refreshPinDots();
      }
      return;
    }
    if(pinBuffer.length<4){
      pinBuffer += k;
      refreshPinDots();
      if(pinBuffer.length===4){
        setTimeout(()=>{
          if(pinBuffer === data.config.pin) openAdmin();
          else { pinErrorEl.textContent = t("pinError"); pinBuffer=""; refreshPinDots(); }
        }, 120);
      }
    }
  }

  document.getElementById("admin-fab").addEventListener("click", ()=>{
    pinBuffer = ""; refreshPinDots(); pinErrorEl.textContent="";
    pinModal.classList.add("show");
  });
  document.getElementById("pin-close").addEventListener("click", ()=> pinModal.classList.remove("show"));
  document.getElementById("admin-close").addEventListener("click", ()=> adminModal.classList.remove("show"));

  function openAdmin(){
    pinModal.classList.remove("show");
    adminModal.classList.add("show");
    renderStockList();
    renderStats();
  }

  /* ============================================================
     ADMIN — TABS
  ============================================================ */
  document.querySelectorAll(".tab-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
      document.querySelectorAll(".tab-pane").forEach(p=>p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById("tab-"+btn.dataset.tab).classList.add("active");
    });
  });

  /* ============================================================
     ADMIN — STOCK
  ============================================================ */
  function renderStockList(){
    const wrap = document.getElementById("stock-list");
    wrap.innerHTML = "";
    data.freebies.forEach(fb=>{
      const row = document.createElement("div");
      row.className = "fb-row" + (fb.stock<=0 ? " stock-zero" : "");
      row.innerHTML = `
        <div class="fb-thumb" style="${fb.image ? `background-image:url('${fb.image}')` : ''}"></div>
        <div class="fb-mini-fields">
          <input data-field="name" value="${escapeHtml(fb.name)}" placeholder="${escapeHtml(t('placeholderName'))}">
          <input data-field="image" value="${escapeHtml(fb.image)}" placeholder="${escapeHtml(t('placeholderImage'))}">
        </div>
        <div class="qty-box">
          <button data-action="dec">−</button>
          <span data-field="stockLabel" style="min-width:20px;text-align:center;font-size:13px;">${fb.stock}</span>
          <button data-action="inc">+</button>
        </div>
        <label style="display:flex;flex-direction:column;align-items:center;font-size:9px;color:var(--star-dim);">
          <input type="checkbox" data-field="isUltra" ${fb.isUltra?"checked":""}>
          ${escapeHtml(t('ultraLabel'))}
        </label>
      `;
      row.querySelector('[data-field="name"]').addEventListener("input", e=>{
        fb.name = e.target.value; saveData(); renderCarousel();
      });
      row.querySelector('[data-field="image"]').addEventListener("input", e=>{
        fb.image = e.target.value; saveData(); renderCarousel();
        row.querySelector(".fb-thumb").style.backgroundImage = fb.image ? `url('${fb.image}')` : "";
      });
      row.querySelector('[data-field="isUltra"]').addEventListener("change", e=>{
        fb.isUltra = e.target.checked; saveData();
      });
      row.querySelector('[data-action="inc"]').addEventListener("click", ()=>{
        fb.stock++; saveData(); renderStockList();
      });
      row.querySelector('[data-action="dec"]').addEventListener("click", ()=>{
        fb.stock = Math.max(0, fb.stock-1); saveData(); renderStockList();
      });
      wrap.appendChild(row);
    });
  }

  document.getElementById("reset-stock-btn").addEventListener("click", ()=>{
    if(!confirm(t("confirmResetStock"))) return;
    const fresh = defaultFreebies();
    data.freebies = fresh.map((f,i)=>Object.assign({}, f, {
      name: data.freebies[i] ? data.freebies[i].name : f.name,
      image: data.freebies[i] ? data.freebies[i].image : f.image,
      isUltra: data.freebies[i] ? data.freebies[i].isUltra : f.isUltra
    }));
    saveData(); renderStockList(); renderCarousel();
  });

  /* ============================================================
     ADMIN — STATS
  ============================================================ */
  function renderStats(){
    document.getElementById("stat-total").textContent = data.stats.total;
    const wrap = document.getElementById("stat-breakdown");
    wrap.innerHTML = "";
    data.freebies.forEach(fb=>{
      const count = data.stats.byId[fb.id] || 0;
      const line = document.createElement("div");
      line.className = "stat-line";
      line.innerHTML = `<span>${escapeHtml(fb.name)}${fb.isUltra?`<span class="ultra-badge">${escapeHtml(t('ultraLabel').toUpperCase())}</span>`:''}</span><span>${count}</span>`;
      wrap.appendChild(line);
    });
  }

  document.getElementById("reset-stats-btn").addEventListener("click", ()=>{
    if(!confirm(t("confirmResetStats"))) return;
    data.stats = { total:0, byId:{} };
    data.history = [];
    saveData();
    renderStats();
    updateDrawCountText();
  });

  /* ============================================================
     ADMIN — CUSTOMISATION
  ============================================================ */
  document.getElementById("save-custom-btn").addEventListener("click", ()=>{
    data.config.title = document.getElementById("cfg-title").value || data.config.title;
    data.config.tagline = document.getElementById("cfg-tagline").value || data.config.tagline;
    data.config.logo = document.getElementById("cfg-logo").value.trim();
    data.config.bg = document.getElementById("cfg-bg").value.trim();
    data.config.frame = document.getElementById("cfg-frame").value.trim();
    data.config.charBlue = document.getElementById("cfg-char-blue").value.trim();
    data.config.charYellow = document.getElementById("cfg-char-yellow").value.trim();
    data.config.charPink = document.getElementById("cfg-char-pink").value.trim();
    data.config.lightstick = document.getElementById("cfg-lightstick").value.trim();
    data.config.drawBtnUseImage = document.getElementById("cfg-btn-use-image").checked;
    data.config.drawBtnColor = document.getElementById("cfg-btn-color").value;
    data.config.drawBtnImage = document.getElementById("cfg-btn-image").value.trim();
    const pin = document.getElementById("cfg-pin").value.trim();
    data.config.pin = /^\d{4}$/.test(pin) ? pin : data.config.pin;
    saveData();
    applyConfig();
    renderCarousel();
    alert(t("savedAlert"));
  });

  function escapeHtml(str){
    return (str||"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }

  /* ============================================================
     INIT
  ============================================================ */
  applyConfig();
  renderCarousel();
  buildGalaxyCloud();

})();
</script>
</body>
</html>
